services:

  postgres:
    image: postgres:16-alpine
    container_name: lecturecode-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lecturecode
      POSTGRES_PASSWORD: lecturecode
      POSTGRES_DB: lecturecode_pro

    ports:
      - "5432:5432"

    volumes:
      - lecturecode_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U lecturecode -d lecturecode_pro"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: lecturecode-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - lecturecode_redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: lecturecode-redis-http
    restart: unless-stopped

    ports:
      - "8079:80"

    environment:
      SRH_MODE: env
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy


  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: lecturecode-piston
    restart: unless-stopped

    privileged: true

    ports:
      - "2000:2000"

    volumes:
      - lecturecode_piston_data:/piston

    # Override the image's failing healthcheck for Windows/Docker Desktop.
    healthcheck:
      disable: true


volumes:

  lecturecode_postgres_data:

  lecturecode_redis_data:

  lecturecode_piston_data: